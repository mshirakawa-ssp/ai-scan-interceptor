# Credentials / secrets detection rules.
#
# Detects common forms of API keys, access tokens, and private keys that should
# never be pasted into an external AI service. All sample values used here are
# documented "example" credentials (e.g. AKIAIOSFODNN7EXAMPLE from AWS docs) or
# fully synthetic prefixes — no real credentials are embedded.
#
# severity: low | medium | high | critical
# action:   log | alert | block | mask

policies:
  - name: aws_access_key_id
    description: "AWS Access Key ID (AKIA / ASIA prefix + 16 base32 chars). Example: AKIAIOSFODNN7EXAMPLE."
    pattern: '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'
    severity: critical
    action: block
    tags: [secret, aws]

  - name: aws_secret_access_key
    description: "AWS Secret Access Key heuristic (40-char base64-ish with keyword context)."
    pattern: '(?i)aws(?:.{0,20})?(?:secret|private).{0,20}[''"]?[A-Za-z0-9/+=]{40}[''"]?'
    severity: critical
    action: block
    tags: [secret, aws]

  - name: google_api_key
    description: "Google API Key (AIza prefix + 35 chars)."
    pattern: '\bAIza[0-9A-Za-z\-_]{35}\b'
    severity: critical
    action: block
    tags: [secret, gcp]

  - name: github_personal_access_token
    description: "GitHub Personal Access Token (ghp_/gho_/ghu_/ghs_/ghr_) or fine-grained (github_pat_)."
    pattern: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{82}\b'
    severity: critical
    action: block
    tags: [secret, github, vcs]

  - name: openai_api_key
    description: "OpenAI API key (sk- or sk-proj- prefix). Length 40+ to reduce false positives."
    pattern: '\bsk-(?:proj-)?[A-Za-z0-9_\-]{40,}\b'
    severity: critical
    action: block
    tags: [secret, openai, llm]

  - name: anthropic_api_key
    description: "Anthropic API key (sk-ant- prefix)."
    pattern: '\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{80,}\b'
    severity: critical
    action: block
    tags: [secret, anthropic, llm]

  - name: jwt_token
    description: "JSON Web Token (three base64url segments separated by dots)."
    pattern: '\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
    severity: high
    action: alert
    tags: [secret, jwt, auth]

  - name: slack_bot_token
    description: "Slack bot / user / app tokens (xoxb-, xoxp-, xoxa-, xoxs-, xoxr-)."
    pattern: '\bxox[baprs]-[A-Za-z0-9\-]{10,}\b'
    severity: critical
    action: block
    tags: [secret, slack]

  - name: private_ssh_or_pem_key
    description: "PEM-encoded private key header (RSA, EC, OPENSSH, DSA, generic)."
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
    severity: critical
    action: block
    tags: [secret, key, pem]
