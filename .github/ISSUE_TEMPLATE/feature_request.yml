name: 機能提案 / Feature Request
description: 新しい機能や改善のアイデアを提案する
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        機能提案ありがとうございます。
        大規模な機能追加・アーキテクチャ変更の場合は、PR の前に Discussions での議論を推奨します。

  - type: textarea
    id: purpose
    attributes:
      label: 機能の目的
      description: この機能で何を実現したいか
    validations:
      required: true

  - type: textarea
    id: pain
    attributes:
      label: 現状の Pain Point
      description: 現状の課題・困りごとを具体的に
      placeholder: 現在は X ができないため、運用で Y のような回避策が必要
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: どのようなインターフェース・実装で実現するか（あれば擬似コードや UI 案も）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に検討した解決策があれば

  - type: dropdown
    id: priority
    attributes:
      label: 優先度（あなたにとって）
      options:
        - 困っていないが、あると嬉しい
        - 運用上、欲しい
        - これがないと使えない
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
