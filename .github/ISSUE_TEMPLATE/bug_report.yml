name: バグ報告 / Bug Report
description: 動作の不具合・想定外の挙動を報告する
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        AI-Scan-Interceptor のバグ報告ありがとうございます。
        セキュリティ脆弱性の報告は [SECURITY.md](../../SECURITY.md) のフローを使用してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: バグの一行サマリー
      placeholder: ICAP server が起動時にクラッシュする
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: ステップ by ステップで再現できる手順を記載
      placeholder: |
        1. `git clone ...`
        2. `make certs`
        3. `docker compose up -d`
        4. ICAP server のログにエラーが出る
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AI-Scan-Interceptor のバージョン
      placeholder: v0.1.0 / commit hash / main
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux (Ubuntu/Debian)
        - Linux (RHEL/CentOS/Rocky)
        - macOS
        - Windows (WSL2)
        - その他
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker / Docker Compose バージョン
      placeholder: Docker 24.0.7, Compose v2.21.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ抜粋
      description: 関連するログを貼り付けてください（機密情報は除去）
      render: text

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: スクリーンショット、関連 Issue、その他参考情報
