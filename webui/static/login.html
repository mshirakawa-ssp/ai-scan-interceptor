<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>AI Scan Interceptor - ログイン</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: #0d1530;
    border: 1px solid #1e2f5c;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }
  .login-box h1 {
    font-size: 20px;
    font-weight: 700;
    color: #60a5fa;
    margin-bottom: 4px;
  }
  .login-box .sub {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    background: #0f1117;
    border: 1px solid #2d3148;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 16px;
  }
  input:focus { border-color: #2563eb; }
  button {
    width: 100%;
    background: #2563eb;
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #1e3a8a; cursor: not-allowed; opacity: 0.7; }
  .error-msg {
    font-size: 12px;
    color: #ef4444;
    min-height: 18px;
    margin-bottom: 10px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>AI Scan Interceptor</h1>
  <div class="sub">ダッシュボードにアクセスするにはログインしてください</div>
  <form id="login-form" autocomplete="off">
    <label for="username">ユーザー名</label>
    <input id="username" type="text" name="username" autocomplete="username" required>
    <label for="password">パスワード</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <div id="error-msg" class="error-msg"></div>
    <button type="submit" id="login-btn">ログイン</button>
  </form>
</div>
<script src="/login.js"></script>
</body>
</html>
