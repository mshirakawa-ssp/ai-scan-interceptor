# =============================================================
# AI-Scan-Interceptor — Squid SSL Bump Configuration
# Intercepted traffic is inspected by ICAP server (monitoring only).
# Requires squid-ca.pem to be distributed to all monitored endpoints.
# =============================================================

# ---- Performance ----
max_filedescriptors 65536
workers 2


# ---- HTTP port with SSL Bump ----
# tls-proxy listens on :3128 (external). Squid runs on :3129 (internal only).
http_port 3129 ssl-bump \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=16MB \
    cert=/etc/squid/ssl_cert/squid-ca.pem \
    key=/etc/squid/ssl_cert/squid-ca.key

# SSL certificate generator (used for dynamic cert creation per domain)
sslcrtd_program /usr/lib/squid/security_file_certgen \
    -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 8 startup=1 idle=1

# ---- ACLs ----
# Defined early so ssl_bump rules can reference them.
acl step1 at_step SslBump1
# Anthropic domains reach Squid only via tls-proxy's fallback tunnel.
# Splice them (no re-bump) to avoid double-MITM and Cloudflare JA3 blocking.
acl anthropic_tls dstdomain api.anthropic.com a-api.anthropic.com claude.ai
# AI services inspected via ICAP (Anthropic is handled by tls-proxy, not here)
acl ai_services dstdomain \
    api.openai.com \
    chatgpt.com \
    generativelanguage.googleapis.com \
    gemini.google.com \
    api.githubcopilot.com \
    .openai.azure.com

# ---- SSL Bump steps ----
# Bump only known AI services; splice everything else (Slack, etc.) transparently.
ssl_bump peek step1
ssl_bump splice anthropic_tls
ssl_bump bump ai_services
ssl_bump splice all

# ---- ICAP configuration ----
# Send originating client IP to ICAP server for hostname-based user identification
icap_send_client_ip on
icap_enable on
icap_connect_timeout 10 seconds
icap_io_timeout      60 seconds
icap_service_revival_delay 5
# Never suspend ICAP service; with bypass=1 failures pass through silently.
icap_service_failure_limit -1

# AI prompt inspection service (REQMOD = inspect outgoing requests)
icap_service ai_scanner reqmod_precache bypass=1 \
    icap://icap-server:1344/ai-scan

adaptation_access ai_scanner allow ai_services
adaptation_access ai_scanner deny all

# AI response inspection service (RESPMOD = inspect incoming AI responses)
icap_service ai_response_scan respmod_precache bypass=on \
    icap://icap-server:1344/request_scan

adaptation_access ai_response_scan allow ai_services
adaptation_access ai_response_scan deny all

# ---- Cache ----
cache_dir ufs /var/cache/squid 512 16 256
cache_mem 256 MB
maximum_object_size_in_memory 512 KB

# Do not cache AI API responses (streamed / dynamic)
# Anthropic spliced domains are excluded from ai_services but should also not be cached
acl anthropic_domains dstdomain claude.ai a-api.anthropic.com api.anthropic.com
cache deny ai_services
cache deny anthropic_domains

# ---- Access control ----
http_access allow all

# ---- Logging ----
access_log /var/log/squid/access.log combined
cache_log  /var/log/squid/cache.log

# ---- Misc ----
forwarded_for delete
via off
